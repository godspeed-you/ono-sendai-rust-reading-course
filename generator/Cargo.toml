[package]
name = "ono-course"
version = "1.0.0"
description = "Deterministic static generator and validator for the Ono-Sendai Rust Reading Course"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ono-course"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
