  code: "impl Value {\n    /// A short name of the value's type, used in error messages.\n    pub fn type_name(&self) -> &'static str {\n        match self {\n            Value::Nothing => \"nothing\",\n            Value::Int(_) => \"int\",\n            Value::Text(_) => \"text\",\n            Value::List(_) => \"list\",\n        }\n    }\n"
