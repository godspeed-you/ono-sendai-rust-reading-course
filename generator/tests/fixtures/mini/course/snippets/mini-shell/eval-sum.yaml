  code: "pub fn sum(values: &[Value]) -> Result<i64, EvalError> {\n    let mut total = 0;\n    for v in values {\n        match v {\n            Value::Int(n) => total += n,\n            other => {\n                return Err(EvalError::TypeMismatch { expected: \"int\", found: other.type_name() })\n            }\n        }\n    }\n    Ok(total)\n}\n"
