  code: "pub struct Context {\n    pub vars: HashMap<String, Value>,\n}\n\npub fn eval_word(ctx: &Context, word: &str) -> Result<Value, EvalError> {\n    if let Some(name) = word.strip_prefix('$') {\n        return Ok(ctx.vars.get(name).cloned().unwrap_or(Value::Nothing));\n    }\n    match word.parse::<i64>() {\n        Ok(n) => Ok(Value::Int(n)),\n        Err(_) => Ok(Value::Text(word.to_string())),\n    }\n}\n"
