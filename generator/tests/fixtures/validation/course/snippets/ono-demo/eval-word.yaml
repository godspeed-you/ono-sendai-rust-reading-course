    code: |
      /// Evaluates a word against a lookup table.
      pub fn eval(word: &Word, lookup: &dyn Fn(&str) -> Option<i64>) -> Option<i64> {
          match word {
              Word::Number(n) => Some(*n),
              Word::Name(name) => lookup(name),
          }
      }
