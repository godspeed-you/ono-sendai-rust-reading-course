    code: |
      /// Adds up all values, stopping at the first negative one.
      pub fn sum_until_negative(values: &[i64]) -> i64 {
          let mut total = 0;
          for v in values {
              if *v < 0 {
                  break;
              }
              total += v;
          }
          total
      }
