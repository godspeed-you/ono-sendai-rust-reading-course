  content_hash: sha256:69a9a063c82792ef373ac7a337029b93f0b62d43b362c2910eece118b4ec270c
  code: |
    /// A collection of records to be presented, as columns and rows of cell text.
    #[derive(Debug, Clone, Default)]
    pub struct Table {
        columns: Vec<Column>,
        rows: Vec<Vec<Cell>>,
    }
- start_line: 164
  end_line: 184
  anchor: pub fn rows(&self) -> &[Vec<Cell>] {
  content_hash: sha256:cc3b019f4d896cdbaa5e4a9966b44d68a4ff4fff0a83dc4696ba3eb96b77b414
  code: |2
        /// The table's columns.
        #[must_use]
        pub fn columns(&self) -> &[Column] {
            &self.columns
        }

        /// The table's rows.
        #[must_use]
        pub fn rows(&self) -> &[Vec<Cell>] {
            &self.rows
        }

        /// The cells of row `index`.
        ///
        /// # Panics
        ///
        /// Panics if `index` is out of range, like any slice index.
        #[must_use]
        pub fn row(&self, index: usize) -> &[Cell] {
            &self.rows[index]
        }
