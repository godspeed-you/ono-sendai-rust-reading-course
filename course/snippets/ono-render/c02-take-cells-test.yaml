        #[test]
        fn should_drop_a_character_that_would_straddle_the_limit_when_taking_cells() {
            // A wide character in a one-cell budget cannot be half-printed.
            assert_eq!(take_cells("日", 1), "");
            assert_eq!(take_cells("日", 2), "日");
        }
