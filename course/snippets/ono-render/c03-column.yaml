  anchor: pub struct Column {
  content_hash: sha256:ac89f6836a91a700b453d0fc725fcca89474a45b3032c11483e67902f3f57975
  code: |
    /// A column of a table: a stable header and how its values are aligned.
    #[derive(Debug, Clone)]
    pub struct Column {
        header: String,
        align: Align,
    }

    impl Column {
        /// A left-aligned column with the given header.
        #[must_use]
        pub fn new(header: impl Into<String>) -> Self {
            Self {
                header: header.into(),
                align: Align::Left,
            }
        }
- start_line: 63
