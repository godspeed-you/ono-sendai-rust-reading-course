  content_hash: sha256:2bc2c4650056cd71cb566837a4987441ad797ff3457cf2d3f232ba7b7054bc74
  code: |2
        /// The column's header.
        #[must_use]
        pub fn header(&self) -> &str {
            &self.header
        }

        /// How the column's values are aligned.
        #[must_use]
        pub fn alignment(&self) -> Align {
            self.align
        }
    }
