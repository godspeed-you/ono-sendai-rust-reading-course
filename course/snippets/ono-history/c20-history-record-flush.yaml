  anchor: fn private_options() -> OpenOptions {
  content_hash: sha256:d5600b5fb6716165355ae579284be33e14a6631a8c377ec9d83b04f5f98a0a8d
  code: |
    fn private_options() -> OpenOptions {
        let mut options = OpenOptions::new();
        options.create(true).write(true);
        #[cfg(unix)]
        std::os::unix::fs::OpenOptionsExt::mode(&mut options, 0o600);
        options
    }

    /// Creates or truncates a file that only its owner can read.
    fn private_file(path: &Path) -> std::io::Result<File> {
        private_options().truncate(true).open(path)
    }
