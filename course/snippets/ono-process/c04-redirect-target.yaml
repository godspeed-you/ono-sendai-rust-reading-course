  code: |2
        /// The descriptor this redirection changes.
        #[must_use]
        pub const fn target(&self) -> Fd {
            match self {
                Self::Read { fd, .. }
                | Self::Write { fd, .. }
                | Self::Append { fd, .. }
                | Self::Duplicate { fd, .. } => *fd,
            }
        }
