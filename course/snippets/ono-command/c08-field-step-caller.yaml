  code: |
    /// One step of a field chain, optional where it was written `?.`.
    fn field_step(access: &FieldAccess) -> FieldStep<'_> {
        if access.optional {
            FieldStep::optional(&access.field)
        } else {
            FieldStep::required(&access.field)
        }
    }
