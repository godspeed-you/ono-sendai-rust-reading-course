  anchor: values.map_or_else(Vec::new, |hook| hook.complete(command, selector, prefix))
  content_hash: sha256:e0a67bc5e72e5472c1e14c1111ca27336dd073558262624c7d678bd2a834e2bd
  code: |
    fn selector_values(
        command: &CommandContract,
        selector: &ParameterSpec,
        prefix: &str,
        values: Option<&dyn ValueCompleter>,
    ) -> Vec<Candidate> {
        let closed = selector.closed_set();
        if !closed.is_empty() {
            return closed
                .into_iter()
                .filter(|value| value.starts_with(prefix))
                .map(|value| Candidate::value(value).with_doc(selector.doc()))
                .collect();
        }
        values.map_or_else(Vec::new, |hook| hook.complete(command, selector, prefix))
    }
