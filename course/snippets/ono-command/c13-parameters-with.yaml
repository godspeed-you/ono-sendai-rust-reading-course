  code: |
    fn parameters_with(
        raw: Vec<RawParameter>,
        error: &dyn Fn(String) -> ErrorValue,
    ) -> Result<Vec<ParameterSpec>, ErrorValue> {
        raw.into_iter()
            .map(|parameter| {
                let declared_type: DeclaredType =
                    parameter
                        .declared_type
                        .parse()
                        .map_err(|failure: ErrorValue| {
                            error(format!("`{}`: {}", parameter.name, failure.message()))
                        })?;
