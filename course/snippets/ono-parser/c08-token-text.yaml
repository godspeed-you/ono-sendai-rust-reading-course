  code: |
    /// One lexical token: what it is and where it came from.
    #[derive(Debug, Clone, Copy, PartialEq, Eq)]
    pub struct Token {
        /// The lexical class.
        pub kind: TokenKind,
        /// The source range the token covers.
        pub span: Span,
    }

    impl Token {
        /// The exact source text of the token.
        #[must_use]
        pub fn text<'a>(&self, source: &'a str) -> &'a str {
            self.span.of(source)
        }
    }
