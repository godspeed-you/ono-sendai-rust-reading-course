    /// The native-endian `u32` at `offset`, if the buffer reaches that far.
    pub(crate) fn u32_at(bytes: &[u8], offset: usize) -> Option<u32> {
        bytes
            .get(offset..)
            .and_then(<[u8]>::first_chunk::<4>)
            .copied()
            .map(u32::from_ne_bytes)
    }
