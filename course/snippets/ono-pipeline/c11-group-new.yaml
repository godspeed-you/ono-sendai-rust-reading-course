  code: |
    pub struct Group {
        key: Box<dyn KeyFn>,
        window: Option<Window>,
    }

    impl Group {
        /// Groups by `key`.
        #[must_use]
        pub fn new(key: impl KeyFn) -> Self {
            Self {
                key: Box::new(key),
                window: None,
            }
        }
