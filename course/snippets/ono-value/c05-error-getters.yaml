    #[derive(Debug, Clone, PartialEq)]
    pub struct ErrorValue {
        code: ErrorCode,
        message: Arc<str>,
        target: Option<ValueRef>,
        source: Option<Arc<ErrorValue>>,
        help: Option<Arc<str>>,
        retryable: Option<bool>,
        metadata: MapValue,
