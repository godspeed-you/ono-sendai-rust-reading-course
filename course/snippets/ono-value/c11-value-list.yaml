  code: |2
        /// Builds a string value.
        #[must_use]
        pub fn string(text: &str) -> Self {
            Value::String(text.into())
        }

        /// Builds a list value.
        #[must_use]
        pub fn list(items: impl IntoIterator<Item = Value>) -> Self {
            Value::List(items.into_iter().collect())
        }
