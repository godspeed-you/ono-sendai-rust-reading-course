  code: |
    impl RecordValue {
        /// Starts building a record of `schema`, with every field unknown.
        #[must_use]
        pub fn builder(schema: Arc<Schema>, provenance: Provenance) -> RecordBuilder {
            let fields = vec![Value::Null; schema.field_count()];
            RecordBuilder {
                record: RecordValue {
                    schema,
                    fields,
                    extra: MapValue::new(),
                    provenance,
                },
            }
        }
