  code: |2
        /// Resolves a unit from its exact suffix. Matching is case-sensitive so `MB` and `MiB` can
        /// never be confused for one another.
        #[must_use]
        pub fn from_suffix(suffix: &str) -> Option<Self> {
            Self::ALL
                .iter()
                .copied()
                .find(|unit| unit.suffix() == suffix)
        }
