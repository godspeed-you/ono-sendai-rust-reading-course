  code: |
    impl ErrorValue {
        /// Creates an error with a stable code and a human message.
        #[must_use]
        pub fn new(code: ErrorCode, message: impl Into<Arc<str>>) -> Self {
            Self {
                code,
                message: message.into(),
                target: None,
                source: None,
                help: None,
                retryable: None,
                metadata: MapValue::new(),
            }
        }
