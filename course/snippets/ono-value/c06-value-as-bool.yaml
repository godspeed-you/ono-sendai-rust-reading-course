  content_hash: sha256:a6e66606cd4a296b10f25220a040c4b7e6729e7a2ea02f9af995943ba76ce8c8
  code: |2
        fn mismatch(&self, wanted: &str) -> ErrorValue {
            ErrorValue::new(
                ErrorCode::TypeMismatch,
                format!("expected {wanted} but found {}", self.type_name()),
            )
        }
