    impl Value {
        /// The stable name of the value's type, as `type` reports it and as error messages spell it.
        #[must_use]
        pub const fn type_name(&self) -> &'static str {
            match self {
                Value::Null => "null",
                Value::Bool(_) => "bool",
                Value::Int(_) => "int",
                Value::Float(_) => "float",
                Value::Decimal(_) => "decimal",
                Value::String(_) => "string",
                Value::Bytes(_) => "bytes",
