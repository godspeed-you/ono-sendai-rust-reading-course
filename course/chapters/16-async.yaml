id: async
number: 16
title: Reading async Rust
summary: |
  Ono-Sendai is a synchronous shell with a lot of asynchronous code underneath it: the
  workspace contains hundreds of `async fn`s, yet `fn main` is an ordinary function and there is
  no `#[tokio::main]` anywhere outside tests. This chapter teaches you to *read* that code:
  what an `async fn` returns, what `.await` means, why a future does nothing until it is awaited,
  how Ono-Sendai bounds slow calls with timeouts, how `#[async_trait]` and hand-written
  `Pin<Box<dyn Future>>` put async methods behind trait objects, and where the Tokio runtime
  comes from in the first place. You will not write async code here; you will learn to see
  where a function can pause, what runs concurrently with what, and what does *not* run in
  parallel.

  The next chapter, [Tasks, channels and cancellation](chapter:tasks-channels), builds on this
  one: it shows how those futures become tasks connected by channels.
lessons:
  - id: async-01
    title: "An async function is a recipe: `collect_content`"
    stage: practice
    summary: "Read the simplest real `async fn` in Ono-Sendai, and learn what calling it does — and does not — do."
    prerequisites: [smart-pointers-04, result-errors-03]
    concepts: [async-await, futures, pattern-matching, ownership]
    ono_topics: [async-execution, pipeline]
    objectives:
      - Read an `async fn` signature and name the type of value a call to it produces.
      - Explain why a future does nothing until it is awaited.
      - Identify every `.await` in a function as a point where it may pause.
      - Trace every way `collect_content` can finish and what happens to its input stream.
    sections:
      - type: prose
        kind: context
        title: Where we are
        body: |
          Some commands write *content*: `write file` stores the bytes that arrive on the
          pipeline, so `… | to json | write file out.json` can save a document. The pipeline
          arrives as a [`ValueStream`](glossary:value-stream) — a stream of values produced by other parts of the pipeline
          while this command waits for them. `collect_content` in
          `crates/ono-command/src/impls/mutate.rs` drains that stream into one `bytes` value.
          Its caller, the provider-mutation command, uses it like this (line 135 of the same
          file):
      - type: code
        snippet: c16-collect-content-call
      - type: prose
        kind: context
        title: One line, three steps
        body: |
          That is the whole pattern of async Rust in one line: a call, then `.await`, then `?`.
          This lesson takes it apart.
      - type: prose
        kind: rust
        title: What does `async fn` mean?
        body: |
          An [`async fn`](glossary:async-fn) looks like an ordinary function, but calling it **does not run its
          body**. The call returns a [*future*](glossary:future): a value that holds the arguments and remembers
          where in the body it has got to. The body runs only when something *polls* that
          future, which in Ono-Sendai's code almost always means `.await`.

          So the declared return type is not what the call returns. Read the signature on line 474
          of the code below, `async fn collect_content(mut input: ValueStream, spelling: &str) ->
          Result<Value, ErrorValue>`, as "a function that returns *some future* whose **output** is
          `Result<Value, ErrorValue>`". The future's exact type is generated by the compiler and
          has no name you can write; that detail matters in [lesson 3](lesson:async-03).

          `.await` does two things. It drives the future until it produces its output, and it
          marks a [**potential suspension point**](glossary:await-point): if the awaited thing is not ready (here: no
          value has arrived on the stream yet), the current function pauses, gives its thread
          back to the runtime so other work can run, and resumes at exactly this point later.
          Local variables such as `content` survive the pause, because they live inside the
          future, not on a thread's stack.

          `?` after `.await` then works exactly as in [chapter 6](lesson:result-errors-03): it
          returns early with the error, converting it via `From` where the types differ.
      - type: code
        snippet: c16-collect-content
        caption: |
          `crates/ono-command/src/impls/mutate.rs`. One `.await`, a loop, a `match` and two early
          returns.
        highlight: [476]
        annotations:
          - lines: 474
            token: "mut input: ValueStream"
            kind: ownership
            body: |
              The stream is taken **by value**: the future owns it. It is `mut` because
              `ValueStream::recv` takes `&mut self` — receiving advances the stream. When the
              future finishes (or is dropped), `input` is dropped with it.
          - lines: 476
            token: ".await"
            kind: flow
            body: |
              The only suspension point in the function. Each loop iteration may pause here
              until the next event arrives. `recv` yields `None` when the stream has ended,
              which ends the `while let` loop.
          - lines: 480-491
            kind: flow
            body: |
              Any value that is neither text nor bytes ends the whole function with a
              `TypeMismatch` error. The rest of the stream is never read.
          - lines: 492
            kind: flow
            body: |
              A per-item failure that travelled down the pipeline becomes this function's
              failure: a partial result would be written as if it were the whole content.
      - type: prose
        kind: rust
        title: A future does nothing until it is awaited
        body: |
          Because a call only builds a future, these two lines behave very differently. This is
          an illustration, not Ono-Sendai code:

          ```rust
          let pending = collect_content(input, &spelling); // nothing has been read yet
          let content = pending.await?;                    // now the loop runs
          ```

          After the first line, `input` has been *moved into* `pending`, but no event has been
          received. If `pending` were dropped instead of awaited, the loop would never run at
          all. Rust warns about this: futures are marked `#[must_use]`, because a future that
          is never awaited is almost always a bug.
      - type: prose
        kind: ono
        title: Why is this function async at all?
        body: |
          The events on the stream are produced by *other* stages of the pipeline, which run
          concurrently with this one (the next chapter shows they are separate Tokio tasks).
          Waiting for the next event is waiting on someone else. Writing that wait as `.await`
          lets the runtime's worker thread do other work — for example, run the very stage that
          will produce the next value — instead of sitting blocked.

          The doc comment states the rule the body enforces: strings and bytes are concatenated
          "byte for byte (spec §12.1)", and "anything else has no byte form the shell may invent
          (spec §12.3)". The error's help text tells the user how to *choose* a representation
          (`… | to json | write file …`) instead of the shell guessing one.
      - type: diagram
        kind: control-flow
        title: Where `collect_content` can pause and where it can stop
        art: |
          call ──► future created (nothing read)
                        │ .await by caller
                        ▼
                ┌─► input.recv().await ──── None ───────────► Ok(Value::Bytes(content))
                │        │  (may pause here)
                │        ▼ Some(event)
                │   String / Bytes ── append ──┐
                │   other value ───────────────┼──────────► Err(TypeMismatch)
                │   Failure(error) ────────────┼──────────► Err(error)
                └──────────────────────────────┘
        description: |
          Calling `collect_content` only creates a future. When the caller awaits it, the
          function loops on `input.recv().await`, which is the one place it may pause. Each
          event is handled by the `match`: a string or bytes value is appended to `content` and
          the loop continues; any other value ends the function with a `TypeMismatch` error; a
          failure event ends it with that failure. When `recv` yields `None` the stream has
          ended and the function returns `Ok` with the collected bytes.
      - type: exercise
        id: async-01-q1
        exercise_type: multiple-choice
        prompt: |
          The caller writes `collect_content(input, &spelling).await?`. Consider only the call
          `collect_content(input, &spelling)`, before `.await` is applied. What has happened when
          that call returns?
        choices:
          - text: "The loop has started; the first event has already been received."
            correct: false
            feedback: |
              No. The body of an `async fn` does not run when it is called. Nothing is received
              until the future is polled, which `.await` does.
          - text: "A future has been created that owns `input` and borrows `spelling`; none of the body has run."
            correct: true
            feedback: |
              Right. The call packages the arguments into a future. `input` has been moved into
              it and `spelling` is borrowed by it (so the future cannot outlive `spelling`). The
              loop runs only when the future is awaited.
          - text: "A new thread has been started to drain the stream."
            correct: false
            feedback: |
              No. An `async fn` never starts a thread by itself. Where the future's body
              eventually runs is decided by whoever polls it.
          - text: "A Tokio task has been spawned that will run the function in the background."
            correct: false
            feedback: |
              No. Spawning is an explicit call (`tokio::spawn`, next chapter). An `async fn` call
              only builds a value; if that value is dropped unawaited, nothing ever runs.
      - type: exercise
        id: async-01-q2
        exercise_type: trace-control-flow
        prompt: |
          List every way an awaited `collect_content` can finish. For each one, say what the
          function returns, and whether the rest of the input stream is read. Then say what
          happens to `input` in every case.
        hints:
          - level: 1
            body: |
              Count the `return` expressions, and do not forget the loop's normal exit.
        solution:
          summary: |
            Three exits: `Ok(Value::Bytes(...))` when the stream ends normally; `Err(TypeMismatch)`
            at the first value that is neither text nor bytes; `Err(error)` at the first failure
            event. In every case `input` is dropped when the function finishes, because the
            future owns it.
          analysis:
            - aspect: control-flow
              body: |
                The `while let` loop ends only when `input.recv().await` yields `None` — the
                stream is finished — which reaches `Ok(Value::Bytes(content.into()))` on line
                495. Inside the loop, the arm on lines 480–491 returns a `TypeMismatch` error and
                the arm on line 492 returns the failure it received. There is no other exit.
            - aspect: ownership
              body: |
                `input` was moved into the function (`mut input: ValueStream`). On every exit,
                including the early returns, it goes out of scope and is dropped. The events
                that were never received are dropped with it.
            - aspect: errors
              body: |
                Errors are not collected or skipped: the first bad value or failure decides the
                result. That is deliberate — content written to a file must be complete.
            - aspect: async
              body: |
                The only suspension point is `.await` on line 476. Between two awaits, the body
                runs without interruption; the loop may pause many times, once per event that
                is not yet available.
          guarantees: |
            The doc comment and code guarantee: text and bytes are concatenated in arrival
            order, byte for byte; any other value is refused with a help message naming
            `to json`; an upstream failure is passed on unchanged.
          semantics: |
            Because `input` is owned, dropping it at the end is automatic (ownership, [chapter 7](chapter:ownership-moves)).
            Because the function is `async`, none of this runs until the caller awaits the future.
          interpretation: |
            Dropping the stream early is how a consumer tells the producers it has stopped
            listening; the next chapter shows that this makes their next send fail. Reading the
            refusal as "stop early and let the producers notice" is an interpretation of how the
            pieces fit together, confirmed in [the next chapter](chapter:tasks-channels).
      - type: exercise
        id: async-01-q3
        exercise_type: predict
        prompt: |
          The stream delivers these events in order: `Value(String "a")`, `Value(Bytes [0x62])`,
          `Value(Int 3)`, `Value(String "c")`, then ends. Predict the result of the awaited call
          and the error message text, assuming the command's spelling is `write file`.
        solution:
          summary: |
            `Err` with code `TypeMismatch` and message "`write file` writes bytes or text, and a
            int is neither" (the type name comes from `Value::type_name`), with help
            "choose the representation: `… | to json | write file` (spec §12.3)". The string
            `"c"` is never received.
          analysis:
            - aspect: control-flow
              body: |
                The first two events match lines 478 and 479 and append `a` then `b` to
                `content`. The third, `Int 3`, falls into the `other` arm on line 480, which
                returns immediately.
            - aspect: outputs
              body: |
                The collected `ab` is discarded: `content` is a local variable of the future and
                is dropped on return. The function produces only the error.
            - aspect: ownership
              body: |
                `other` binds the `Value::Int` by value; it is used only for `type_name()` in the
                message and dropped afterwards. The unread `"c"` is dropped together with
                `input`.
          guarantees: |
            The code guarantees no partial content is returned when a non-byte value appears.
          semantics: |
            `return` inside an `async fn` completes the future with that value, exactly like a
            `return` in a normal function completes the call.
          interpretation: |
            The exact spelling of the type name depends on `Value::type_name`, which is outside
            this snippet; the structure of the message is what the snippet fixes.
  - id: async-02
    title: "Futures are values: `budgeted`, `connect` and `join!`"
    stage: practice
    summary: "See futures passed around as values, bounded by a timeout, and run concurrently — but not in parallel — with `tokio::join!`."
    prerequisites: [async-01]
    concepts: [futures, async-await, tokio, impl-trait, conditional-compilation]
    ono_topics: [async-execution, providers, system-integration]
    objectives:
      - Explain why passing a future as `impl Future` lets the callee decide when the work starts.
      - Decode the nested `Result` returned by `tokio::time::timeout` and match its three outcomes.
      - Distinguish sequential awaits from `tokio::join!`, and concurrency from parallelism.
    sections:
      - type: prose
        kind: context
        title: Where we are
        body: |
          `get service` and `get session` are answered over D-Bus by the systemd provider
          (`crates/ono-provider-systemd`). A D-Bus peer can hang. The module that talks to the
          bus therefore wraps *every* call in a time budget, and the shell connects its two
          D-Bus providers side by side at startup of the provider registry. Both behaviours are
          visible in about forty lines.
      - type: code
        snippet: c16-budgeted-connect
        caption: |
          `crates/ono-provider-systemd/src/dbus.rs`: the budget, `SystemBus::connect`, and the
          helper every bus call goes through.
        annotations:
          - lines: 74
            token: ".await?"
            kind: flow
            body: |
              Await, then `?`. The bus connection is opened first; if that fails, the function
              returns the `BusError` and the proxy is never built. Two awaits in sequence are
              two steps in sequence — the second does not start until the first has finished.
          - lines: 77
            token: "Proxy::new(&connection, DESTINATION, MANAGER_PATH, MANAGER_INTERFACE)"
            kind: rust
            body: |
              `Proxy::new` is itself async, so this expression only *creates* a future. It is
              handed to `budgeted` unstarted.
          - lines: 402
            token: "call: impl Future<Output = zbus::Result<T>>"
            kind: type
            body: |
              `impl Trait` in argument position: `budgeted` accepts any future whose output is a
              `zbus::Result<T>`. Each call site passes a different, unnameable future type; this
              is an anonymous generic parameter ([chapter 11](chapter:generics)).
          - lines: 404-411
            kind: flow
            body: |
              `timeout(CALL_BUDGET, call)` is a new future. Its output wraps the call's output in
              one more `Result`: `Ok(inner)` if the call finished in time, `Err(Elapsed)` if the
              budget ran out. With `zbus::Result<T>` inside, there are three cases to match.
      - type: prose
        kind: rust
        title: Futures are lazy, so they can be handed around
        body: |
          The first lesson showed that calling an `async fn` builds a future without running it.
          `budgeted` depends on that. Its caller writes `Proxy::new(...)` or
          `Connection::system()` as an argument; those calls return futures, and no D-Bus
          traffic has happened yet. Inside `budgeted`, `tokio::time::timeout(CALL_BUDGET, call)`
          wraps the future, and only the `.await` on line 404 starts it — with the timer already
          running.

          If the timer wins, `timeout` [**drops** the inner future](glossary:cancellation). Dropping a future is how async
          Rust cancels it: the future simply stops being polled, at whichever `.await` it was
          paused on, and everything it owned is dropped. No code of the D-Bus call runs after
          that point.

          Had `budgeted` taken the call's *result* instead of its future, the call would already
          have finished (or hung) before `budgeted` got control. Taking the future is what lets
          the function bound it.
      - type: code
        snippet: c16-register-async
        caption: |
          `crates/ono-cli/src/providers.rs`: registering the two D-Bus providers. The body only
          exists in builds with the `systemd` feature.
        annotations:
          - lines: 134
            kind: rust
            body: |
              Without the `systemd` feature the body contains no `.await`, and Clippy would
              complain that the function need not be `async`. `cfg_attr` silences that lint only
              in such builds; the function stays async so its callers do not change.
          - lines: 136-137
            kind: rust
            body: |
              In a build without systemd, `registry` would be an unused parameter; `let _ =
              registry;` uses it without doing anything.
          - lines: 144-147
            token: "tokio::join!("
            kind: flow
            body: |
              `join!` polls both futures until **both** have finished and returns their outputs
              as a tuple. Both `connect` functions never fail (a missing bus becomes an
              "unavailable" provider), so the tuple holds two providers, not two `Result`s.
      - type: prose
        kind: rust
        title: "`join!` is concurrency, not parallelism"
        body: |
          `tokio::join!` does not start threads or tasks. It builds one future that polls both
          inner futures from the same task: when the systemd handshake is waiting for the bus
          to answer, the logind handshake gets polled, and vice versa. The waiting overlaps; the
          CPU work does not run at the same instant on two cores. That is *concurrency* —
          several things in progress — and it is exactly what I/O-bound work needs.

          *Parallelism* — two pieces of code running at the same instant on different threads —
          would need separate tasks on a multi-thread runtime (next chapter) or separate threads.
          "Async means parallel" is a false shortcut; in this function it is plainly false,
          because `register_async` is run with `runtime.block_on(...)` on the calling thread
          ([lesson 4](lesson:async-04)).

          Note also `registry: &mut ProviderRegistry`. The future returned by `register_async`
          holds that mutable borrow across its awaits, so nothing else can touch the registry
          until the future completes. The borrow checker enforces this for futures exactly as
          for ordinary calls.
      - type: prose
        kind: ono
        title: Why does Ono-Sendai do this?
        body: |
          The comments say it directly. On the budget (lines 32–36): "A shell that blocks
          forever on a wedged bus is a shell nobody can use (spec §34)." On `register_async`
          (lines 131–133): systemd "is registered separately rather than being made synchronous,
          because pretending an I/O-bound constructor is not one is how a shell acquires a hang
          at startup." And on `join!` (lines 140–143): two handshakes "opened side by side, …
          cost one of them (spec §34)" — while registration *order* is kept, because order
          decides which provider answers a target.
      - type: diagram
        kind: control-flow
        title: Sequential awaits versus `join!`
        art: |
          connect():            open_system_bus ──► Proxy::new ──► Ok(Self)
                                 (await)             (await)
                                 second starts only after the first finishes

          register_async():     one task
                                ├─ SystemdProvider::connect ─ wait ─ poll ─ wait ─ done
                                └─ SessionProvider::connect  ── poll ─ wait ─ poll ─ done
                                   (waits overlap; polls take turns on one thread)
                                        │
                                        ▼
                                register(systemd); register(logind)   (order kept)
        description: |
          In `SystemBus::connect` the two awaits run one after the other: the proxy is only
          built after the connection exists. In `register_async`, `tokio::join!` polls both
          provider constructors from one task. While one waits for the bus, the other is polled,
          so their waiting times overlap, but only one of them runs at any instant. When both
          are done, the two providers are registered in a fixed order.
      - type: exercise
        id: async-02-q1
        exercise_type: multiple-choice
        prompt: |
          What does `tokio::join!` on lines 144–147 do with the two `connect()` futures?
        choices:
          - text: "It spawns two Tokio tasks and waits for both."
            correct: false
            feedback: |
              No. `join!` spawns nothing. Spawning would require `tokio::spawn` and would impose
              `Send + 'static` bounds that `join!` does not need.
          - text: "It awaits the first, then the second."
            correct: false
            feedback: |
              That would be two sequential `.await`s, as in `SystemBus::connect`. `join!` exists
              precisely to avoid that.
          - text: "It polls both from the same task, so their waiting overlaps; it finishes when both are done."
            correct: true
            feedback: |
              Right. This is concurrency within one task. Each future makes progress when it
              can; while one waits for D-Bus, the other is polled.
          - text: "It runs the two handshakes in parallel on two worker threads."
            correct: false
            feedback: |
              No. A single task is polled by one thread at a time. Overlapping *waits* is not
              the same as running code in parallel.
      - type: exercise
        id: async-02-q2
        exercise_type: trace-control-flow
        prompt: |
          `budgeted("building the … proxy", Proxy::new(...))` is awaited in three situations:
          (a) the bus answers within 2 seconds with the proxy; (b) the bus answers within 2
          seconds with the D-Bus error `org.freedesktop.DBus.Error.AccessDenied`; (c) the bus
          never answers. For each, name the arm of the `match` that runs and what
          `SystemBus::connect` returns.
        hints:
          - level: 1
            body: |
              Write down the full type of `tokio::time::timeout(CALL_BUDGET, call).await`
              before looking at the arms.
        solution:
          summary: |
            (a) `Ok(Ok(value))` — `connect` returns `Ok(SystemBus { … })`. (b) `Ok(Err(error))`
            — `translate` maps the D-Bus error name, and `connect` returns that `BusError` via
            `?`. (c) after 10 seconds, `Err(_)` — `connect` returns `BusError::TimedOut` with
            "… did not answer within 10 seconds".
          analysis:
            - aspect: types
              body: |
                The awaited value has type `Result<zbus::Result<T>, Elapsed>`, i.e.
                `Result<Result<T, zbus::Error>, Elapsed>`. The outer `Result` says whether the
                budget held; the inner one says whether D-Bus succeeded.
            - aspect: control-flow
              body: |
                The three arms cover every case: `Ok(Ok(value))`, `Ok(Err(error))` and `Err(_)`.
                The match is exhaustive, so the compiler would reject a forgotten case. In
                `connect`, the `?` after `.await` on line 79 returns any `Err` immediately.
            - aspect: errors
              body: |
                Case (b) goes through `translate` (line 418 onward in the file), which maps
                `AccessDenied` to `BusError::PermissionDenied` carrying systemd's own sentence.
            - aspect: async
              body: |
                In case (c) the timeout future completes with `Err(Elapsed)` after
                `CALL_BUDGET`, and the inner `Proxy::new` future is dropped unfinished — it is
                cancelled at the await it was paused on.
          guarantees: |
            Every call through `budgeted` finishes within `CALL_BUDGET` (10 seconds) with either
            the value or a `BusError`; it never waits indefinitely at an `.await`. (A timeout can
            only act between polls: it cannot interrupt code that blocks a thread inside a single
            poll, which is why blocking work goes to `spawn_blocking` — [lesson 4](lesson:async-04).)
          semantics: |
            `match` exhaustiveness forces all three outcomes to be handled; `?` propagates the
            `BusError` unchanged because `connect` returns the same error type.
          interpretation: |
            Mapping D-Bus error names to a handful of `BusError` variants is the provider's way
            of giving the user a distinction they can act on (permission, missing unit,
            unavailable, timed out), as the doc comment of `translate` says.
      - type: exercise
        id: async-02-q3
        exercise_type: identify-abstraction
        prompt: |
          Suppose `budgeted` were declared as
          `fn budgeted<T>(what: &str, result: zbus::Result<T>) -> Result<T, BusError>` and every
          caller wrote `budgeted("…", Proxy::new(…).await)`. What would be lost, and why does
          the real signature avoid it?
        solution:
          summary: |
            The timeout would be lost. With a `Result` parameter, the caller must finish the
            call (by awaiting it) before `budgeted` runs, so a hung bus hangs the caller before
            any budget applies. Taking an unstarted `impl Future` lets `budgeted` start the call
            *inside* `tokio::time::timeout`.
          analysis:
            - aspect: async
              body: |
                Futures are lazy. `Proxy::new(…)` without `.await` is a value describing work not
                yet done, so it can be passed to the function that decides how to run it.
            - aspect: types
              body: |
                `impl Future<Output = zbus::Result<T>>` is an anonymous type parameter: each call
                site's future type is different and cannot be named, and the compiler generates
                one `budgeted` per future type (static dispatch).
            - aspect: purpose
              body: |
                One helper applies one policy — the 10-second budget and the error translation —
                to every bus call in the crate, instead of each call site repeating it.
          guarantees: |
            With the real signature, no bus call routed through `budgeted` can run outside the
            budget.
          semantics: |
            Argument-position `impl Trait` is sugar for a generic parameter with that bound; the
            future is moved into `budgeted` and then into `timeout`.
          interpretation: |
            This is a general pattern worth recognising elsewhere: a function that wraps
            behaviour *around* async work (a timeout, a retry, a log line) takes the future, not
            its output.
  - id: async-03
    title: "Async methods behind trait objects: `#[async_trait]` and `OutcomeFuture`"
    stage: practice
    summary: "Understand why async methods on `dyn` traits need boxed futures, and read both the macro version and the hand-written version in Ono-Sendai."
    prerequisites: [async-02]
    concepts: [futures, traits, trait-objects, send-sync, lifetimes, macros]
    ono_topics: [async-execution, command-dispatch, providers]
    objectives:
      - "Read `#[async_trait::async_trait]` as a rewrite of each `async fn` into a method returning `Pin<Box<dyn Future + Send>>`."
      - Explain why a trait used as `dyn Trait` cannot simply declare `async fn`.
      - Read `OutcomeFuture<'a>` and the default and overriding implementations of `invoke_async`.
    sections:
      - type: prose
        kind: context
        title: Where we are
        body: |
          Two traits in Ono-Sendai need async methods *and* are used as trait objects.
          `Accounts` (`crates/ono-provider-linux/src/accounts.rs`) resolves user and group ids;
          the process provider holds it as `Arc<dyn Accounts>` so a test can substitute fake
          accounts. `CommandImpl` (`crates/ono-command/src/invoke.rs`, first read in
          [chapter 10](lesson:traits-04)) is the native implementation of one command; the
          command table stores implementations as
          `Arc<dyn CommandImpl>`. The first trait uses a macro; the second spells out by hand
          what that macro generates. Reading both side by side removes the magic.
      - type: code
        snippet: c16-accounts-trait
        caption: |
          `crates/ono-provider-linux/src/accounts.rs`: an injectable source of accounts. Four
          async lookups, two synchronous enumerations.
        annotations:
          - lines: 72
            kind: rust
            body: |
              The attribute macro [`async_trait`](glossary:async-trait) rewrites every `async fn` in the trait (and, with
              the same attribute on each `impl`, in every implementation). It was a black box
              since the `Provider` trait in [chapter 10](lesson:traits-03); the rest of this
              lesson opens it.
          - lines: 73
            token: "Send + Sync + std::fmt::Debug"
            kind: type
            body: |
              Supertraits: every implementation must be [`Send`](glossary:send) (may be moved to another thread),
              `Sync` (may be *shared* between threads through `&`) and printable with `{:?}`.
              `Arc<dyn Accounts>` is shared by tasks on a multi-thread runtime, which needs
              exactly `Send + Sync`.
          - lines: 91
            kind: rust
            body: |
              Not every method is async: enumerating reads the account files, which the trait
              declares as an ordinary call.
      - type: prose
        kind: rust
        title: Why `async fn` and `dyn` do not mix directly
        body: |
          A trait object `dyn Accounts` is used through a table of function pointers: each
          method must have **one** signature that every implementation shares. But each
          `async fn` returns its own compiler-generated future type, with its own size, and that
          type differs from implementation to implementation. Recent Rust (1.75 and later)
          does allow `async fn` directly in traits, but such a trait is [**not dyn-compatible**](glossary:object-safety)
          (not usable as `dyn Trait`) for exactly this reason — the last of the object-safety
          rules listed in [chapter 10](lesson:traits-04).

          The standard way out is to return one fixed type for every implementation: a
          heap-allocated future behind a trait object.

          ```rust
          Pin<Box<dyn Future<Output = Option<UserAccount>> + Send + 'a>>
          ```

          Read it from the inside out:

          - `dyn Future<Output = …>`: *some* future producing that output; the concrete type is
            hidden.
          - `Box<…>`: on the heap, so the pointer has one known size whatever the future is.
          - `+ Send`: the future may be moved to another thread between polls, which a
            multi-thread runtime does with tasks.
          - `+ 'a`: the future may borrow things (such as `&self`) that live at least as long
            as `'a`.
          - `Pin<…>`: a promise that the future will not be moved in memory once it has
            started. Futures produced by `async` code may point into themselves, so they must
            stay put. **Black box for now:** read `Pin<Box<dyn Future …>>` as "a heap-allocated
            future of some type"; you do not need more to read Ono-Sendai. The related marker
            trait `Unpin`, which you may meet as a bound on I/O types (`R: AsyncRead + Unpin`),
            marks types that are safe to move even after being pinned; read such a bound as a
            technical requirement of the async I/O API, not as a design statement.

          `#[async_trait]` writes this for you. Roughly, `async fn user(&self, uid: u32) ->
          Option<UserAccount>` becomes

          ```rust
          fn user<'life0, 'async_trait>(&'life0 self, uid: u32)
              -> Pin<Box<dyn Future<Output = Option<UserAccount>> + Send + 'async_trait>>
          where 'life0: 'async_trait
          ```

          and the body becomes `Box::pin(async move { … })`. That expansion is illustrative (the
          exact generated names are the macro's business), but its shape is what you are
          reading whenever you see the attribute — including on the `Provider` trait of
          [chapter 19](lesson:provider-boundary-01).
      - type: code
        snippet: c16-command-impl-async
        caption: |
          `crates/ono-command/src/invoke.rs`: the same idea written by hand, with a named alias
          for the boxed future.
        highlight: [421, 453, 454]
        annotations:
          - lines: 421
            kind: type
            body: |
              A type alias with a lifetime parameter: `OutcomeFuture<'a>` is a boxed, `Send`
              future producing `Result<Outcome, ErrorValue>` that may borrow for `'a`. The doc
              comment above says why: "boxed so the trait stays object-safe" (object-safe is the
              older name for dyn-compatible).
          - lines: 453
            token: "fn invoke_async<'a>(&'a self, ctx: &'a mut Invocation<'_>) -> OutcomeFuture<'a>"
            kind: type
            body: |
              Both `self` and `ctx` are borrowed for `'a`, and the returned future lives for
              `'a`. The future may therefore use both; the caller cannot touch `ctx` again until
              the future is finished or dropped.
          - lines: 454
            kind: flow
            body: |
              The default. `self.invoke(ctx)` is an ordinary argument expression, so it runs
              **now**, when `invoke_async` is called. `std::future::ready(x)` wraps the finished
              result in a future that is complete the first time it is polled.
      - type: code
        snippet: c16-provider-mutation-invoke
        caption: |
          `crates/ono-command/src/impls/mutate.rs`: a mutation overrides both methods.
        annotations:
          - lines: 535-537
            kind: flow
            body: |
              The synchronous entry point refuses with `must_be_awaited` rather than guessing:
              a mutation has to await the provider.
          - lines: 540
            token: "Box::pin(async move { self.run(ctx).await })"
            kind: rust
            body: |
              An `async move` block is a future literal. `move` moves the two *references*
              `self` and `ctx` into the block; the block's body — calling and awaiting
              `self.run(ctx)` — runs only when the returned future is polled.
      - type: prose
        kind: ono
        title: Why does Ono-Sendai do this?
        body: |
          The doc comment of `invoke` explains why most commands never await anything: "A
          producer hands back the provider's stream and a transform hands back a stage over its
          input, so neither has to await anything: the awaiting happens inside the stream, where
          backpressure and cancellation already live (ADR-0013)." A mutation is different:
          `Provider::act` and `Provider::resolve` are async, and "a mutation has to hold one
          `ActionOutcome` per target before it can answer". So the trait offers both entry
          points, with a default that makes the async one correct for every command, and hosts
          are told to call `CommandTable::run`, which goes through `invoke_async`.

          For `Accounts`, the doc comment names the reason for a trait at all: "so a test can
          state exactly which accounts exist — and so a lookup that never returns can be
          exercised without a directory server." [Chapter 19](lesson:provider-boundary-03) reads
          such a test double.
      - type: exercise
        id: async-03-q1
        exercise_type: multiple-choice
        prompt: |
          `ProviderProducer` (the implementation behind `get process`) implements only `invoke`
          and keeps the default `invoke_async`. When the host calls
          `implementation.invoke_async(ctx)` and later awaits the returned future, when does
          `ProviderProducer::invoke` run?
        choices:
          - text: "When the returned future is first polled by `.await`."
            correct: false
            feedback: |
              That would be true for an `async` block, whose body is deferred. Here
              `self.invoke(ctx)` is an argument to `ready`, and arguments are evaluated before
              the call.
          - text: "Immediately, inside the call to `invoke_async`; the future only carries the finished result."
            correct: true
            feedback: |
              Right. `std::future::ready(self.invoke(ctx))` evaluates `self.invoke(ctx)` first,
              then wraps its result in an already-complete future. Awaiting it returns at once.
          - text: "On a blocking thread chosen by Tokio."
            correct: false
            feedback: |
              Nothing here involves `spawn_blocking`. The call runs on whatever thread calls
              `invoke_async`.
          - text: "Never: the default returns `must_be_awaited`."
            correct: false
            feedback: |
              `must_be_awaited` is what a *mutation's* synchronous `invoke` returns. The default
              `invoke_async` delegates to `invoke`.
      - type: exercise
        id: async-03-q2
        exercise_type: identify-abstraction
        prompt: |
          `CommandImpl` could have declared `async fn invoke_async(&self, ctx: &mut
          Invocation<'_>) -> Result<Outcome, ErrorValue>;` directly (Rust allows `async fn` in
          traits). What would break in Ono-Sendai, and what does each part of `OutcomeFuture<'a>`
          buy instead?
        hints:
          - level: 1
            body: |
              Look at how the command table stores implementations: `BTreeMap<String, Arc<dyn
              CommandImpl>>`.
        solution:
          summary: |
            The command table stores `Arc<dyn CommandImpl>`. A trait with a native `async fn` is
            not dyn-compatible, so the table could not hold mixed implementations. Returning
            `Pin<Box<dyn Future<…> + Send + 'a>>` gives every implementation the same return
            type, keeps the future sendable between threads, and lets it borrow `self` and `ctx`.
          analysis:
            - aspect: traits
              body: |
                Dynamic dispatch needs one signature per method for all implementations. Each
                `async fn` body has its own anonymous future type, so the return type must be
                erased behind `dyn Future`.
            - aspect: types
              body: |
                `Box` gives the erased future a fixed-size handle; `Pin` keeps it from moving
                after it starts; `Send` allows it to be polled on any worker thread; `'a` ties it
                to the borrows of `self` and `ctx`.
            - aspect: architecture
              body: |
                Commands are looked up by id at run time (`CommandTable`, registered as
                `Arc<dyn CommandImpl>`), and a KUANG/11 package or a test host may replace one
                (doc of `CommandTable::register`). That requires dynamic dispatch.
            - aspect: async
              body: |
                The cost is one heap allocation per call. For the common synchronous commands the
                default wraps an already-computed result in `ready`, so no real waiting happens.
          guarantees: |
            The doc comment states the intent: "boxed so the trait stays object-safe".
          semantics: |
            `dyn Trait` requires a dyn-compatible trait; `async fn` in a trait makes it
            non-dyn-compatible; `Pin<Box<dyn Future>>` is the standard erased future type.
          interpretation: |
            `#[async_trait]` on `Accounts` and `Provider` solves the same problem with a macro;
            `CommandImpl` writes it by hand, perhaps because it wants a named alias
            (`OutcomeFuture`) and a synchronous default. The code does not document why the
            macro was not used here, so treat that as a guess.
      - type: exercise
        id: async-03-q3
        exercise_type: trace-value
        prompt: |
          Follow `self` and `ctx` through `ProviderMutation::invoke_async` (line 539–541).
          Which values are moved, which are borrowed, how long does the returned future keep
          them, and what does that mean for the caller who passed `&mut invocation`?
        solution:
          summary: |
            Nothing owned is moved: `self` and `ctx` are references, and `async move` moves
            those references into the future. The future holds `&'a ProviderMutation` and
            `&'a mut Invocation`, so for as long as the future exists the caller cannot use
            `invocation` — the mutable borrow is exclusive.
          analysis:
            - aspect: ownership
              body: |
                `self: &'a Self` and `ctx: &'a mut Invocation<'_>` are copied/moved into the
                `async move` block. A shared reference is `Copy`; a mutable reference is moved
                (reborrowed) into the block. The `ProviderMutation` and the `Invocation` stay
                where they are, owned by the command table and the caller.
            - aspect: types
              body: |
                The return type `OutcomeFuture<'a>` carries `'a`, which states that the future
                does not outlive either borrow.
            - aspect: async
              body: |
                Nothing runs until the future is polled; then `self.run(ctx)` runs, awaiting the
                provider as needed.
          guarantees: |
            The signature guarantees the future cannot outlive `self` or `ctx`.
          semantics: |
            Exclusive `&mut` borrow rules apply to a future exactly as to any value holding the
            borrow: while it exists, no other access to `invocation` compiles.
          interpretation: |
            This is why the host awaits the future right away (`table.run(…).await`, seen in
            [chapter 18](lesson:execution-path-02)) rather than storing it: the invocation is
            locked until the command has answered.
  - id: async-04
    title: "Where async starts: a lazy runtime, `block_on`, and blocking work"
    stage: practice
    summary: "Find where the Tokio runtime is built, how the synchronous evaluator enters async code, and how blocking lookups are kept off the async workers with a timeout."
    prerequisites: [async-03]
    concepts: [tokio, futures, tasks, send-sync, option, closures]
    ono_topics: [async-execution, system-integration, providers]
    objectives:
      - Explain what `Session::runtime` builds, when, and why lazily.
      - "Read `runtime.block_on(future)` as the bridge from synchronous to asynchronous code."
      - "Explain `spawn_blocking` and why a timed-out blocking task keeps running."
      - "Decode `timeout(..).await.ok()?.ok()?`."
    sections:
      - type: prose
        kind: context
        title: Where we are
        body: |
          `fn main` in `crates/ono-cli/src/main.rs` is synchronous, and so are the REPL loop,
          the parser and the evaluator. Async code needs an *executor* to poll it. In
          Ono-Sendai that executor is [a Tokio multi-thread runtime](glossary:tokio-runtime) that the `Session` builds the
          first time a native pipeline or the provider registry needs it. From then on, the
          synchronous evaluator enters async code with `block_on`. This lesson reads that
          bridge, and one place where async code hands *blocking* work to a separate pool of
          threads.
      - type: code
        snippet: c16-session-runtime
        caption: |
          `crates/ono-cli/src/session.rs`: the runtime built on first use, a borrow-free handle
          to it, and the first `block_on` a session performs — registering the D-Bus providers
          from [lesson 2](lesson:async-02).
        annotations:
          - lines: 792-797
            kind: rust
            body: |
              A runtime is an ordinary value. `new_multi_thread()` asks for a pool of worker
              threads; `enable_all()` switches on the timer and I/O drivers (without them
              `tokio::time::timeout` could not work); the workers are named `ono`. `.build()`
              returns a `Result`, and `.ok()` turns a failure into `None`.
          - lines: 804-809
            kind: ownership
            body: |
              A `Handle` is a cheap, cloneable reference to the runtime. Returning an owned
              `Handle` (note `.cloned()`) means the caller does not keep `self` borrowed.
          - lines: 1444
            token: "runtime.block_on(crate::providers::register_async(&mut registry));"
            kind: flow
            body: |
              The bridge. [`block_on`](glossary:block-on) runs the future on **this** thread until it completes,
              blocking the thread meanwhile. The evaluator waits here; while it waits, the
              future may use the runtime (timers, I/O, spawned tasks).
      - type: prose
        kind: rust
        title: "`block_on`, worker threads, and what runs where"
        body: |
          There are now three kinds of threads to keep apart:

          - **The evaluator's thread** (the main thread). It calls `block_on(future)`. The
            future passed to `block_on` is polled on this thread.
          - **Worker threads** named `ono`. Tasks created with `tokio::spawn` run here
            ([next chapter](chapter:tasks-channels)). A multi-thread runtime may poll a task on
            one worker, pause it at an `.await`, and resume it on another — which is why
            spawned futures must be `Send`.
          - **The blocking pool.** [`tokio::task::spawn_blocking(f)`](glossary:spawn-blocking) runs an ordinary closure on
            a separate set of threads reserved for code that blocks (waits inside a system call
            without yielding). Running such code on a worker would stall every task scheduled
            on that worker.

          `spawn_blocking` returns a `JoinHandle<T>`, which is itself a future: awaiting it
          yields `Result<T, JoinError>` (`Err` if the closure panicked or the task was
          cancelled before it started).
      - type: code
        snippet: c16-nss-bounded
        caption: |
          `crates/ono-provider-linux/src/accounts.rs`: one NSS lookup on the blocking pool, with
          a deadline, and a cache in front of it.
        highlight: [174]
        annotations:
          - lines: 166-170
            kind: type
            body: |
              `F: FnOnce() -> Option<T> + Send + 'static`: a closure called once, which may be
              sent to another thread and borrows nothing short-lived (`'static`), because the
              blocking thread may still be running it after this function has returned. `T:
              Send + 'static` for the same reason: its result travels back across threads.
          - lines: 172-174
            kind: flow
            body: |
              `timeout(...).await` yields `Result<Result<Option<T>, JoinError>, Elapsed>`. The
              first `.ok()?` returns `None` on timeout; the second `.ok()?` returns `None` if the
              blocking task failed; what remains is the lookup's own `Option<T>`.
          - lines: 180-182
            kind: flow
            body: |
              `cached_user` returns `Option<Option<UserAccount>>`: the outer layer says whether
              the uid is in the cache, the inner layer is the cached answer — which may be "no
              such user".
          - lines: 183-185
            token: "move || {"
            kind: ownership
            body: |
              The closure captures `uid` (a `u32`, which is `Copy`) by value. It owns
              everything it uses, which satisfies `'static`.
      - type: prose
        kind: rust
        title: A timed-out blocking task is abandoned, not cancelled
        body: |
          When the 250 ms deadline passes, `timeout` drops the `JoinHandle` it was awaiting.
          For an ordinary future, dropping cancels it. For `spawn_blocking` it does **not**: a
          thread that is inside a blocking system call cannot be interrupted by Tokio, so the
          closure keeps running to completion on its blocking thread and its result is thrown
          away. Only the *waiting* is cancelled. The comment on lines 172–173 says exactly this.

          (The same holds for `tokio::spawn`: dropping its `JoinHandle` detaches the task rather
          than stopping it. Stopping a spawned task needs `JoinHandle::abort`, which you will see
          in the next chapter — and even `abort` cannot stop a `spawn_blocking` closure that has
          already started.)
      - type: prose
        kind: ono
        title: Why does Ono-Sendai do this?
        body: |
          Lazy runtime: "A shell that runs `echo hi` should not have paid for a thread pool to do
          it, and spec §34's cold-start budget is measured on exactly that command"
          (`session.rs`, lines 131–132; the module doc of `providers.rs` says the same).

          Blocking lookups: the module doc of `accounts.rs` quotes spec §23.6, "NSS lookups can
          be blocking and network-backed", and explains the cache: "`get process` on a busy
          machine asks for the same handful of uids hundreds of times and one hanging lookup
          must not stall the enumeration." `NSS_TIMEOUT` is 250 ms, and giving up "leaves the
          numeric id in place, which spec §23.6 requires anyway".

          The one runtime that does *not* come from `Session::runtime` is the agent's: `ono
          --agent` builds its own multi-thread runtime named `ono-agent` in `main.rs` and calls
          the same `register_async` through `block_on`.
      - type: diagram
        kind: architecture
        title: Threads involved in one NSS lookup
        art: |
          main thread (evaluator, owns Session)
             │ runtime.block_on(future) ── polls the future here
             ▼
          worker threads "ono"  ── spawned tasks, e.g. the process producer
             │ NssAccounts::user(uid).await
             │   bounded(...) ── spawn_blocking(lookup) ──► blocking pool thread
             │                                               getpwuid_r (may hang)
             │   timeout 250 ms ── elapsed? drop the JoinHandle, return None
             ▼                     (the blocking thread finishes on its own)
          record gets the numeric uid; name stays unknown
        description: |
          The evaluator's thread enters async code with `block_on`. Pipeline work runs as tasks
          on the runtime's worker threads. When the process producer asks `NssAccounts::user`
          for a name, `bounded` hands the NSS call to a thread of the blocking pool and waits at
          most 250 ms. If the deadline passes, the wait is abandoned and `None` is returned,
          while the blocking thread finishes its call on its own and its result is discarded.
          The record then carries the numeric uid without a name.
      - type: exercise
        id: async-04-q1
        exercise_type: multiple-choice
        prompt: |
          An LDAP server is down, and `getpwuid_r` for uid 5001 hangs for 30 seconds. What
          happens 250 ms after `NssAccounts::user(5001)` started its lookup?
        choices:
          - text: "The blocking thread is interrupted and the lookup stops."
            correct: false
            feedback: |
              No. Tokio cannot interrupt code inside a blocking system call. The comment on lines
              172–173 says the task "is left running on timeout rather than cancelled".
          - text: "`bounded` returns `None`; the blocking thread keeps running the lookup and its result is discarded."
            correct: true
            feedback: |
              Right. The timeout drops the `JoinHandle`, which abandons the wait but not the
              work. `user` then caches `None` for uid 5001 and returns it.
          - text: "The enumeration waits the full 30 seconds, because `.await` blocks the worker."
            correct: false
            feedback: |
              No. The lookup runs on the blocking pool, and the awaiting future gives up after
              250 ms. `.await` suspends the task; it does not block the worker thread.
          - text: "The `?` operator turns the timeout into a panic."
            correct: false
            feedback: |
              `?` on `Option` returns `None` early; it never panics.
      - type: exercise
        id: async-04-q2
        exercise_type: read-function
        prompt: |
          Read `Lookup::run_bounded` from the DNS provider. It has the same shape as `bounded`,
          but spells out every outcome. Describe its inputs, its three outcomes, and the
          ownership of `self` and `schema`.
        snippets: [c16-dns-run-bounded]
        hints:
          - level: 1
            body: |
              Why is `self.query` cloned on line 250, before anything else happens?
        solution:
          summary: |
            `run_bounded` moves the whole `Lookup` (and the schema) into a blocking task that
            calls the synchronous `self.run(&schema)` (which uses `getaddrinfo`/`getnameinfo`, or
            asks a named `--server` directly), and waits at
            most `LOOKUP_TIMEOUT` (15 s). Success returns the lookup's own `Result`; a failed
            blocking task becomes `ProviderUnavailable` naming the `JoinError`; a timeout becomes
            a retryable `ProviderUnavailable` with the help "no nameserver is answering; the name
            may still exist".
          analysis:
            - aspect: inputs
              body: |
                `self` by value (the `Lookup` is consumed) and `schema: Arc<Schema>` by value.
            - aspect: ownership
              body: |
                The `move` closure on line 251 takes ownership of `self` and `schema`, as the
                `'static` bound of `spawn_blocking` requires. After that line `self` is gone from
                this function, which is why `query` is cloned first: the error messages still
                need the name.
            - aspect: control-flow
              body: |
                `match` on `Result<Result<Result<Vec<RecordValue>, ErrorValue>, JoinError>,
                Elapsed>`: `Ok(Ok(outcome))` returns the lookup's own result unchanged;
                `Ok(Err(joined))` — the thread panicked or was cancelled; `Err(_)` — the deadline
                passed.
            - aspect: async
              body: |
                As in `bounded`, a timeout abandons the blocking task rather than stopping it.
            - aspect: errors
              body: |
                Only the timeout case is marked retryable: a resolver that did not answer may
                answer next time, while a crashed thread is not something a retry is known to fix.
          guarantees: |
            The function returns within `LOOKUP_TIMEOUT`, and it never reports a timeout as
            "name not found" — the help text says the name may still exist.
          semantics: |
            Moving `self` into the closure ends its use in the enclosing function; the borrow
            checker would reject using `self.query` after line 251, hence the earlier clone.
          interpretation: |
            NSS and DNS lookups both use the same "blocking pool plus deadline" shape, and
            `spawn_blocking` recurs wherever an async provider must make a blocking call (the
            netlink provider and the network probe use it too). That suggests a deliberate
            convention for blocking calls in async code — an interpretation, not a documented
            rule.
      - type: exercise
        id: async-04-q3
        exercise_type: trace-value
        prompt: |
          In one session, `get process` asks `NssAccounts::user(5001)` twice. The first lookup
          times out as in question 1. Trace what the cache contains after the first call and
          what the second call returns, and how long it takes.
        solution:
          summary: |
            After the first call the cache maps 5001 to `None` (a cached negative answer). The
            second call finds `Some(None)` in `cached_user` and returns `None` immediately,
            without touching NSS.
          analysis:
            - aspect: control-flow
              body: |
                First call: `cached_user(5001)` is `None` (not cached), so `bounded` runs and
                returns `None` after 250 ms; `.map(user_account)` keeps `None`; `remember_user`
                stores `None`. Second call: `cached_user` returns `Some(None)`, the `if let`
                matches, and `return cached` returns the inner `None`.
            - aspect: types
              body: |
                `Option<Option<UserAccount>>` distinguishes "not in the cache" (`None`) from
                "cached: no such user" (`Some(None)`). A single `Option` could not.
            - aspect: mutation
              body: |
                `remember_user` mutates a `Mutex<HashMap<…>>` through `&self`; the `Mutex`
                provides the synchronization, since many tasks may call `user` at once.
          guarantees: |
            The doc comment guarantees that answers, "including the negative ones", are cached.
          semantics: |
            The cache is behind `&self` and a `Mutex`, so it can be updated from a shared
            reference; a poisoned lock is simply treated as a cache miss (`.ok()?`, `if let Ok`).
          interpretation: |
            A consequence visible from the code, not stated in a comment: a timed-out lookup is
            cached like a genuine "no such user" for the lifetime of this `NssAccounts`, so the
            name will not appear later in the session even if the directory recovers.
